[project]
name = "lightning-sweep"
version = "0.1.0"
description = "Fast exact region sweep for lightning-persistence (Rust, via maturin)"
requires-python = ">=3.11"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "lightning_sweep"
features = ["pyo3/extension-module"]
