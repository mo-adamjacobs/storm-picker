# Build the browser site and publish it to GitHub Pages.
#
# The site is static: web/ (page, worker) plus the Rust engine compiled to WebAssembly
# (web/engine.wasm, built by build.sh). The engine is single-threaded, so no special
# headers (COOP/COEP) are needed.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the WebAssembly target
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Test the engine
        run: cargo test --manifest-path engine/Cargo.toml --release

      - name: Build the engine
        run: ./build.sh

      - name: Assemble site
        run: |
          mkdir -p _site
          cp web/index.html web/app.js web/worker.js web/engine.js web/style.css web/engine.wasm _site/
          ls -l _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
